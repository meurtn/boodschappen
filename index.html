<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lijstjes</title>
<meta name="theme-color" id="themeColor" content="#f6f6f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lijstjes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script>
(function(){var t="auto";try{t=localStorage.getItem("lijstjes.theme")||"auto"}catch(e){}
var d=t==="dark"||(t==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.dataset.theme=d?"dark":"light"})();
</script>
<style>
:root{
  --bg:#f6f6f3;--surface:#fff;--fill:#eeeeea;--text:#1d1f1e;--mute:#6c716c;--faint:#a9ada8;--line:#e3e3de;
  --acc:#2f6b53;--acc-ink:#fff;--soft:#e4eee8;--danger:#b4412f;
  --bar:rgba(246,246,243,.86);--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#111413;--surface:#1a1e1c;--fill:#232826;--text:#e6e8e6;--mute:#969c98;--faint:#636965;--line:#2a2f2d;
  --acc:#76c3a1;--acc-ink:#0e1512;--soft:#1d2c25;--danger:#e8836f;
  --bar:rgba(17,20,19,.86);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));transition:background-color .25s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{opacity:.3;cursor:default}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.grow{flex:1;min-width:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

/* bovenbalk */
.top{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);padding-top:env(safe-area-inset-top);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.barin{display:flex;align-items:center;gap:6px;min-height:56px;padding:6px 0}
.barin h1{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barin h1.sm{font-size:17px;letter-spacing:-.005em}
.sub{font-size:13.5px;color:var(--mute);margin-top:1px}
.sub button{color:var(--acc)}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none;transition:background-color .15s,transform .15s}
.ib:active{background:var(--fill);transform:scale(.94)}
.ib.back{margin-left:-10px}
.ib.sm{width:34px;height:34px;color:var(--mute)}
.ib.sm .i{width:18px;height:18px}
.tb{display:inline-flex;align-items:center;gap:2px;color:var(--acc);font-size:15px;font-weight:500;padding:8px 0 8px 8px;flex:none}
.tb .i{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 11px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:500;flex:none;transition:transform .15s,background-color .15s}
.pill:active{transform:scale(.96);background:var(--fill)}
.pill .i{width:18px;height:18px;color:var(--acc)}

/* toevoegen */
.add{display:flex;align-items:center;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:0 6px 0 12px;margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
.add:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.add>.i{color:var(--faint);width:20px;height:20px}
.add input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;padding:0 10px}
.add input::placeholder,.field::placeholder,.inl::placeholder{color:var(--faint)}
.addb{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .18s,transform .18s var(--ease)}
.addb .i{width:18px;height:18px;stroke-width:2}
.add.has .addb{opacity:1;transform:none;pointer-events:auto}
.sug{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:-2px 0 10px;max-height:46vh;overflow:auto;animation:drop .18s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}}
.s{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:8px 14px;border-bottom:1px solid var(--line)}
.s:last-child{border-bottom:0}
.s.enter{background:var(--fill)}
.s small{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58%}
.s small.inc{color:var(--acc);font-weight:500}
.sug .ch{margin:12px 14px 8px}
.sug .chips{padding:0 14px 14px}
.prog{height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;width:0;background:var(--acc);border-radius:3px;transition:width .4s var(--ease)}

/* pagina-overgangen */
#main.fwd{animation:fwd .26s var(--ease)}
#main.back{animation:bck .26s var(--ease)}
#main.tab{animation:tab .2s ease-out}
@keyframes fwd{from{opacity:0;transform:translateX(20px)}}
@keyframes bck{from{opacity:0;transform:translateX(-20px)}}
@keyframes tab{from{opacity:0;transform:translateY(5px)}}

/* koppen en tekst */
.ch{display:flex;align-items:center;gap:7px;margin:22px 2px 8px;font-size:13px;font-weight:500;color:var(--mute);letter-spacing:.01em}
.ch .em{font-size:15px;line-height:1}
.ch .n{margin-left:auto;font-weight:400;color:var(--faint)}
.ch .n button{color:var(--acc);font-weight:500}
.lead{color:var(--mute);font-size:14.5px;margin:4px 2px 16px}
.hint{color:var(--mute);font-size:13px;margin:10px 2px 0}
.note{color:var(--mute);font-size:13px;margin:0 2px 4px}
.offline{font-size:13px;color:var(--mute);text-align:center;padding:6px 0 0}
.shead{display:flex;align-items:center;gap:10px;margin:26px 2px -8px;font-size:17px;font-weight:600;letter-spacing:-.005em}
.shead b{width:22px;height:22px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:12.5px;font-weight:600}
.shead small{margin-left:auto;font-size:13px;font-weight:400;color:var(--mute)}

/* lijsten */
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.cell{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:9px 14px;border-bottom:1px solid var(--line);transition:background-color .15s}
.cell:last-child{border-bottom:0}
button.cell:active{background:var(--fill)}
.cell>.i{color:var(--mute)}
.cell>.i:last-child{width:18px;height:18px;color:var(--faint)}
.cell .em{font-size:17px;width:22px;text-align:center}
.ct{display:block}
.cs{display:block;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.danger{color:var(--danger);justify-content:center}
.cell select{appearance:none;-webkit-appearance:none;border:0;background:none;outline:0;color:var(--mute);text-align:right;text-align-last:right;max-width:62%;padding:6px 0;cursor:pointer}
.cell select+.i{width:16px;height:16px;margin-left:-6px}
.inl{border:0;background:none;outline:0;text-align:right;width:110px;padding:6px 0}
.inl.grow{width:auto}
.lbl{flex:none}
.qty{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}

/* productregels */
.row{display:flex;align-items:center;min-height:52px;padding-right:8px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tick{width:48px;align-self:stretch;display:grid;place-items:center;flex:none}
.tick .c{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;transition:background-color .18s,border-color .18s}
.tick .i{width:13px;height:13px;stroke:var(--acc-ink);stroke-width:2.6;stroke-dasharray:24;stroke-dashoffset:24}
.tick:active .c{transform:scale(.88)}
.row.done .tick .c{background:var(--acc);border-color:var(--acc)}
.row.done .tick .i{stroke-dashoffset:0}
.row.just .tick .c{animation:pop .32s var(--ease)}
.row.just .tick .i{animation:draw .26s .06s ease-out both}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}}
@keyframes draw{from{stroke-dashoffset:24}}
.rmain{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:8px 8px 8px 0}
.nm{overflow-wrap:anywhere}
.nt{font-size:13px;color:var(--mute)}
.row.done .nm{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--faint)}
.row .qty{padding:0 8px}
.step{display:flex;align-items:center;height:34px;border:1px solid var(--line);border-radius:10px;flex:none}
.step button{width:32px;height:32px;display:grid;place-items:center;color:var(--mute);border-radius:9px;transition:background-color .12s}
.step button:active{background:var(--fill)}
.step .i{width:15px;height:15px;stroke-width:2}
.step b{min-width:18px;padding:0 2px;text-align:center;font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.nx{flex:none;display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;margin-right:4px;border-radius:9px;border:1px solid var(--line);color:var(--mute);font-size:13px}
.nx .i{width:13px;height:13px}
.row.flash,.cell.flash{animation:fl 1s ease-out}
@keyframes fl{from{background:var(--soft)}}

/* knoppen, velden, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-size:15px;font-weight:600;white-space:nowrap;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.975);opacity:.9}
.btn.sec{background:var(--fill);color:var(--text)}
.btn.text{background:none;color:var(--acc)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.field{flex:1;min-width:0;width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;outline:0;transition:border-color .15s,box-shadow .15s}
.field:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.line{display:flex;gap:8px;align-items:center}
.line.center{justify-content:center;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px;margin:12px 2px 0}
.check input{width:18px;height:18px;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.center{justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;transition:background-color .15s,border-color .15s,color .15s,transform .12s}
button.chip:active{transform:scale(.96)}
.chip.on{background:var(--soft);border-color:transparent;color:var(--acc);font-weight:500}
.chip .i{width:14px;height:14px;color:var(--faint)}
.chip.duo{padding:0}
.chip.duo button:first-child{padding:0 4px 0 14px;min-height:34px}
.chip.duo button:last-child{padding:0 10px 0 6px;min-height:34px;display:grid;place-items:center}
.chip small{color:var(--mute);font-size:13px;margin-left:6px}
.seg{display:flex;background:var(--fill);border-radius:11px;padding:3px;gap:2px;margin-bottom:14px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;color:var(--mute);text-align:center;transition:background-color .18s,color .18s,box-shadow .18s}
.seg button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--faint);flex:none;position:relative;transition:background-color .2s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.sw.on{background:var(--acc)}
.sw.on i{transform:translateX(18px)}
.num{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;transition:background-color .18s,border-color .18s}
.num.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.hero{padding:10px 0 20px}
.bigstep{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:16px}
.bigstep button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:transform .12s,background-color .12s}
.bigstep button:active{transform:scale(.92);background:var(--fill)}
.bigstep b{font-size:34px;font-weight:300;letter-spacing:-.02em;min-width:90px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;padding:48px 20px 18px;color:var(--mute);font-size:14.5px}
.empty .eb{width:52px;height:52px;border-radius:50%;background:var(--fill);display:grid;place-items:center;margin:0 auto 14px;color:var(--mute)}
.empty h2{font-size:17px;font-weight:600;color:var(--text);margin-bottom:4px}

/* slepen */
.grip{width:44px;height:44px;margin:-8px -10px -8px 0;display:grid;place-items:center;color:var(--faint);touch-action:none;cursor:grab;flex:none}
.grip .i{width:20px;height:20px}
.group.sorting{overflow:visible}
.group.sorting .cell{transition:transform .2s var(--ease)}
.group.sorting .cell.drag{position:relative;z-index:3;transition:box-shadow .2s;background:var(--surface);border-radius:12px;border-bottom-color:transparent;box-shadow:0 10px 28px rgba(0,0,0,.16),0 0 0 1px var(--line);cursor:grabbing}
.group.sorting .cell.drag .grip{color:var(--acc);cursor:grabbing}
.group.sorting .cell.drag.drop{transition:transform .19s var(--ease),box-shadow .19s;box-shadow:none}
body:has(.sorting){user-select:none;-webkit-user-select:none}

/* tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs>div{max-width:560px;margin:0 auto;display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;color:var(--mute);transition:color .2s}
.tabs .tp{width:52px;height:28px;border-radius:14px;display:grid;place-items:center;transition:background-color .25s,transform .15s}
.tabs button:active .tp{transform:scale(.92)}
.tabs button.on{color:var(--acc);font-weight:500}
.tabs button.on .tp{background:var(--soft)}

/* winkelmodus */
body.shop .add,body.shop .sug,body.shop .step,body.shop .tabs,body.shop .note{display:none}
body.shop .row{min-height:60px}
body.shop .nm{font-size:17px}
body.shop .tick .c{width:26px;height:26px}
body:not(.shop) .shoponly,body:not(.shop) .nx,body:not(.shop) .shopbar{display:none}
.shopbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.shopbar .btn{max-width:528px;margin:0 auto;display:flex}

/* melding en poort */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;display:flex;gap:16px;align-items:center;z-index:30;width:max-content;max-width:calc(100vw - 32px);font-size:14.5px;box-shadow:0 6px 24px rgba(0,0,0,.18);animation:tin .24s var(--ease)}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.toast button{font-weight:600;white-space:nowrap;color:inherit;text-decoration:underline;text-underline-offset:3px}
.gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:24px;text-align:center}
.gate .logo{width:60px;height:60px;border-radius:17px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin:0 auto 20px}
.gate .logo .i{width:28px;height:28px;stroke-width:1.8}
.gate h1{font-size:24px;font-weight:600;letter-spacing:-.015em;margin-bottom:6px}
.gate p{color:var(--mute);max-width:300px;margin:0 auto 24px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div>
    <div class="logo" id="gateLogo"></div>
    <h1>Lijstjes</h1>
    <p id="gateMsg">Even laden...</p>
    <button class="btn" id="gateBtn" hidden></button>
    <div style="margin-top:8px"><button class="btn text" id="gateOut" hidden>Uitloggen</button></div>
  </div>
</div>

<header class="top" id="top"><div class="wrap">
  <div class="barin" id="barIn"></div>
  <div id="listHead" hidden>
    <form class="add" id="addForm" autocomplete="off">
      <span id="addIco"></span>
      <input id="q" type="text" enterkeyhint="done" autocapitalize="sentences" placeholder="Voeg toe, bv. 2 paprika of 500 g gehakt" aria-label="Product toevoegen">
      <button type="submit" class="addb" id="addBtn" aria-label="Toevoegen"></button>
    </form>
    <div class="sug" id="sug" hidden></div>
    <div class="prog" id="progWrap" hidden><i id="prog"></i></div>
  </div>
</div></header>

<main class="wrap" id="main">
  <div class="offline" id="off" hidden>Offline. Wijzigingen worden later gesynchroniseerd.</div>
  <section id="pgList" hidden>
    <p class="note" id="demo" hidden>Demomodus: de lijst staat alleen op dit apparaat.</p>
    <div id="list"></div>
  </section>
  <section id="page" hidden></section>
</main>

<nav class="tabs"><div id="tabs"></div></nav>
<div class="shopbar"><button class="btn wide" data-a="shop">Klaar met winkelen</button></div>
<div id="toastHost"></div>

<script src="firebase-config.js"></script>
<script>
"use strict";
/* ---------- categorieen en productcatalogus ---------- */
const CATS = [
 ["groente","🥦","Groente & fruit"],["brood","🥖","Brood & bakkerij"],["vlees","🥩","Vlees, vis & vega"],
 ["kaas","🧀","Kaas & vleeswaren"],["zuivel","🥛","Zuivel & eieren"],["maaltijd","🥗","Verse maaltijden"],
 ["pasta","🍝","Pasta, rijst & wereldkeuken"],["conserven","🥫","Conserven, soep & saus"],["ontbijt","🥣","Ontbijt & beleg"],
 ["bakken","🧂","Bakken & kruiden"],["snoep","🍪","Koek, snoep & chips"],["dranken","🧃","Frisdrank, sap & water"],
 ["koffie","☕","Koffie & thee"],["alcohol","🍷","Bier & wijn"],["diepvries","🧊","Diepvries"],
 ["verzorging","🧴","Drogisterij"],["huishouden","🧽","Huishouden"],["baby","🍼","Baby & kind"],
 ["dieren","🐾","Huisdieren"],["overig","🛒","Overig"]];
const CAT = Object.fromEntries(CATS.map(c => [c[0], {id:c[0], ico:c[1], name:c[2]}]));
const DEFAULT_ORDER = CATS.map(c => c[0]);
const CATALOG_SRC = {

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const keyOf = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[\/\\.#$\[\]]/g, " ").replace(/\s+/g, " ").trim().slice(0, 80);
const cap = s => { s = String(s).trim().replace(/\s+/g, " "); return s.charAt(0).toUpperCase() + s.slice(1); };
const stepOf = u => (u === "g" || u === "ml") ? 100 : (u === "kg" || u === "l") ? 0.5 : 1;
const defQty = u => (u === "g" || u === "ml") ? 500 : 1;
const fmt = n => String(Math.round(n * 100) / 100).replace(".", ",");
const amount = it => it.unit ? fmt(it.qty || 1) + " " + it.unit : String(it.qty || 1);
const badge = it => it.unit ? amount(it) : ((it.qty || 1) > 1 ? it.qty + "×" : "");
const FAM = {g:["w", 1], kg:["w", 1000], ml:["v", 1], l:["v", 1000]};
function convert(q, from, to){ if (from === to) return q; const a = FAM[from], b = FAM[to]; return a && b && a[0] === b[0] ? q * a[1] / b[1] : null; }
const UNIT_LABEL = [["", "Stuks"], ["g", "Gram"], ["kg", "Kilo"], ["ml", "Milliliter"], ["l", "Liter"]];

const allProducts = () => { const ks = new Set([...Object.keys(CATALOG), ...Object.keys(S.products)]); return [...ks].map(product).filter(Boolean); };
const onList = k => S.items[k] && !S.items[k].checked;
function guessCat(name){ const k = " " + keyOf(name) + " "; for (const [c, words] of Object.entries(GUESS)) if (words.some(w => k.includes(w))) return c; return "overig"; }
function storeList(){ const o = {standaard:{name:"Standaard"}, ...S.stores}; return Object.entries(o).map(([id, s]) => ({id, name:s.name || id, order:s.order})).sort((a, b) => a.id === "standaard" ? -1 : b.id === "standaard" ? 1 : a.name.localeCompare(b.name)); }
// De route van vandaag: de winkels in de volgorde waarin je ze bezoekt (per apparaat onthouden).
function tripStores(){ const all = storeList(), t = trip.map(id => all.find(s => s.id === id)).filter(Boolean); return t.length ? t : [all[0]]; }
function setTrip(t){ trip = t; pref.set("trip", JSON.stringify(t)); render(); }

// Bij welke winkel van de route hoort dit product: vaste winkel als die in de route zit, anders de eerste.
function storeOf(k, it, ids){ const pr = it.store || (S.products[k] && S.products[k].store) || ""; return ids.includes(pr) ? pr : ids[0]; }
// Koopritme: mediaan van de tussenpozen tussen de laatste aankopen.
function rhythm(p){
  const b = p.buys; if (!b || b.length < 3) return null;
  const g = []; for (let i = 1; i < b.length; i++) g.push(b[i] - b[i - 1]); g.sort((x, y) => x - y);
  const days = Math.max(2, Math.round(g[Math.floor(g.length / 2)] / DAY)), since = (Date.now() - b[b.length - 1]) / DAY;
  return {days, since, due:since >= days * 0.85};
}
function dueList(){
  return allProducts().filter(p => { if (S.items[p.k] || p.snooze > Date.now()) return false; const r = rhythm(p); if (r && r.due) { p.r = r; return true; } return false; })
    .sort((a, b) => b.r.since / b.r.days - a.r.since / a.r.days).slice(0, 6);
}
const slim = v => ({name:v.name, qty:v.qty || 1, unit:v.unit || "", cat:v.cat, note:v.note || ""});
const dateStr = at => new Date(at).toLocaleDateString("nl-NL", {weekday:"long", day:"numeric", month:"long"});
function order(st){ const o = ((st || store()).order || DEFAULT_ORDER).filter(c => CAT[c]); for (const c of DEFAULT_ORDER) if (!o.includes(c)) o.push(c); return o; }

const Fire = {
  async init(cfg){
    const v = "https://www.gstatic.com/firebasejs/10.14.1/firebase-";
    const [A, U, F] = await Promise.all([import(v + "app.js"), import(v + "auth.js"), import(v + "firestore.js")]);
    this.F = F; this.U = U;
    const app = A.initializeApp(cfg);
    try { this.db = F.initializeFirestore(app, {localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }
    catch { this.db = F.getFirestore(app); }
    this.auth = U.getAuth(app);
    U.onAuthStateChanged(this.auth, u => {
      user = u; (this.unsubs || []).forEach(f => f()); this.unsubs = [];
      if (!u) return gate("Log in met je Google-account om de gezinslijst te openen.", "Inloggen met Google", () => this.signIn());
      gate("Lijst ophalen...");
      let first = 0;
      this.unsubs = Object.keys(PATH).map(c => F.onSnapshot(F.collection(this.db, PATH[c]), snap => {
        const o = {}; snap.forEach(d => { o[d.id] = d.data(); }); S[c] = o;
        if (!ready && ++first >= Object.keys(PATH).length) start(); else render();
      }, err => {
        if (err.code === "permission-denied") gate("Het account " + (u.email || "") + " heeft geen toegang tot deze lijst.", null, null, true);
        else toast("Synchronisatie mislukt: " + err.code);
      }));
    });
  },
  signIn(){
    const p = new this.U.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
    this.U.signInWithPopup(this.auth, p).catch(e => {
      if (/popup-blocked|operation-not-supported/.test(e.code || "")) return this.U.signInWithRedirect(this.auth, p);
      if (!/popup-closed|cancelled/.test(e.code || "")) gate("Inloggen lukte niet (" + (e.code || e.message) + ").", "Opnieuw proberen", () => this.signIn());
    });
  },
  ref(c, id){ return this.F.doc(this.db, PATH[c], id); },
  fail(e){ toast(e.code === "permission-denied" ? "Geen toegang" : "Opslaan mislukt: " + (e.code || e)); },
  // Wijzigingen meteen lokaal doorvoeren en tonen; Firebase bevestigt daarna via de snapshot.
  // Zo zie je nooit even de oude waarde terug na een wijziging.
  set(c, id, d){ S[c][id] = {...(S[c][id] || {}), ...d}; render(); this.F.setDoc(this.ref(c, id), d, {merge:true}).catch(e => this.fail(e)); },
  del(c, id){ delete S[c][id]; render(); this.F.deleteDoc(this.ref(c, id)).catch(e => this.fail(e)); },
  inc(c, id, f, n){ if (S[c][id]) { S[c][id][f] = (S[c][id][f] || 0) + n; render(); } this.F.updateDoc(this.ref(c, id), {[f]:this.F.increment(n)}).catch(e => this.fail(e)); },
  signOut(){ ready = false; this.U.signOut(this.auth); }
};
function gate(msg, btn, fn, showOut){
  $("gate").hidden = false; $("gateMsg").textContent = msg;
  $("gateBtn").hidden = !btn; if (btn) { $("gateBtn").textContent = btn; $("gateBtn").onclick = fn; }
  $("gateOut").hidden = !showOut; $("gateOut").onclick = () => DB.signOut();
}
function start(){ ready = true; $("gate").hidden = true; boot(); }

/* ---------- acties op de lijst ---------- */
// Hoeveel erbij komt als dit product al op de lijst staat; null als de eenheden niet te combineren zijn.
function delta(ex, a){ const eu = ex.unit || ""; return a && a.explicit ? convert(a.qty, a.unit || "", eu) : stepOf(eu); }
function addItem(rawName, a, extra, quiet){
  a = a || {}; extra = extra || {};
  const k = keyOf(rawName); if (!k) return;
  const p = product(k), ex = S.items[k];
  const name = (p && p.name) || cap(rawName), cat = extra.cat || (p && p.cat) || guessCat(rawName);
  if (ex && !ex.checked) {
    const d = delta(ex, a);
    if (d === null) { if (!quiet) toast(name + " staat er al als " + amount(ex), "Aanpassen", () => go("product", k)); flashKey = k; return render(); }
    DB.inc("items", k, "qty", d);
    if (!quiet) toast(name + ": nu " + amount({qty:(ex.qty || 1) + d, unit:ex.unit}) + " op de lijst");
  } else {
    const unit = a.explicit ? (a.unit || "") : ((p && p.unit) || "");
    const qty = a.explicit ? a.qty : ((p && p.unit && p.dq) || defQty(unit));
    DB.set("items", k, {name, cat, qty, unit, note:extra.note || "", checked:false, by:me(), at:Date.now()});
    if (!quiet && !p && cat === "overig") toast(name + " staat bij Overig", "Categorie kiezen", () => go("product", k));
  }
  DB.set("products", k, {name, cat, n:((S.products[k] && S.products[k].n) || 0) + 1, last:Date.now(), ...(a.explicit && a.unit ? {unit:a.unit, dq:a.qty} : {})});
  flashKey = k; setTimeout(render, 0);
}
function removeItem(k){
  const old = S.items[k]; if (!old) return;
  DB.del("items", k); toast(old.name + " verwijderd", "Ongedaan maken", () => DB.set("items", k, old));
}
function step(k, d){
  const it = S.items[k]; if (!it) return;
  const st = stepOf(it.unit), q = it.qty || 1;
  if (d < 0 && q <= st) return removeItem(k);
  DB.inc("items", k, "qty", d * st);
}
function toggle(k){
  const it = S.items[k]; if (!it) return;
  DB.set("items", k, {checked:!it.checked, checkedAt:Date.now(), checkedBy:me()});
  if (!it.checked) { // aankoop vastleggen voor het koopritme (meerdere tikken binnen 12 uur tellen als een)
    const b = ((S.products[k] && S.products[k].buys) || []).slice(), now = Date.now();
    if (b.length && now - b[b.length - 1] < DAY / 2) b[b.length - 1] = now; else b.push(now);
    DB.set("products", k, {name:it.name, cat:it.cat, buys:b.slice(-6)});
  }
  try { navigator.vibrate && navigator.vibrate(8); } catch {}
}
function clearDone(){
  const done = Object.entries(S.items).filter(([, v]) => v.checked); if (!done.length) return;
  // Bewaar het bezoek bij Vorige lijsten; twee keer wissen binnen 3 uur (bv. Lidl en daarna Plus) telt als een bezoek.
  const now = Date.now(), hist = Object.entries(S.history).sort((a, b) => b[1].at - a[1].at), last = hist[0];
  const merge = last && now - last[1].at < 3 * 36e5, hid = merge ? last[0] : String(now), prev = merge ? last[1] : null;
  const items = (prev ? prev.items : []).filter(i => !done.some(([k]) => k === keyOf(i.name))).concat(done.map(([, v]) => slim(v)));
  DB.set("history", hid, {at:now, by:me(), stores:tripStores().map(s => s.name).join(" + "), items});
  hist.slice(merge ? 10 : 9).forEach(([id]) => DB.del("history", id));
  done.forEach(([k]) => DB.del("items", k));
  toast(nProd(done.length) + " gewist en bewaard bij Vorige lijsten", "Ongedaan maken", () => { done.forEach(([k, v]) => DB.set("items", k, v)); if (prev) DB.set("history", hid, prev); else DB.del("history", hid); });
}
function setList(map){ Object.keys(S.items).forEach(k => { if (!map[k]) DB.del("items", k); }); Object.entries(map).forEach(([k, v]) => DB.set("items", k, v)); }
// Een template of vorige lijst gebruiken: optellen bij de huidige lijst, of als nieuwe lijst klaarzetten.
function applyPack(label, items, replace){
  items = items || [];
  if (!replace) {
    items.forEach(i => addItem(i.name, {qty:i.qty || 1, unit:i.unit || "", explicit:true}, {cat:i.cat, note:i.note}, true));
    home(); return toast(label + " toegevoegd: " + nProd(items.length));
  }

/* ---------- tekenen ---------- */
function buildTabs(){ $("tabs").innerHTML = TABS.map(t => "<button data-a='nav' data-k='" + t[0] + "'><span class='tp'>" + ico(t[2]) + "</span><span>" + t[1] + "</span></button>").join(""); }
function render(force){
  if (!ready || !route || dragLock) return;
  const isList = route === "lijst";
  $("pgList").hidden = !isList; $("listHead").hidden = !isList; $("page").hidden = isList;
  let P;
  if (isList) P = renderList();

    const typing = ae && /INPUT|SELECT/.test(ae.tagName) && $("page").contains(ae);

      const keep = [...$("page").querySelectorAll("input.field")].filter(i => i.id && i.value).map(i => [i.id, i.value]), foc = typing && ae.id;
      $("page").innerHTML = P.html;

  const root = rootOf(route); [...$("tabs").children].forEach((b, i) => b.classList.toggle("on", TABS[i][0] === root));

}
function setShop(on, quiet){
  if (document.body.classList.contains("shop") === on) return;
  document.body.classList.toggle("shop", on);
  try { if (on && navigator.wakeLock) navigator.wakeLock.request("screen").then(l => { wake = l; }).catch(() => {}); else if (wake) { wake.release(); wake = null; } } catch {}
  if (!quiet) render();
}

/* ---------- melding ---------- */
let toastTimer;
function toast(msg, act, fn){
  clearTimeout(toastTimer);
  const host = $("toastHost");
  host.innerHTML = "<div class='toast' role='status'><span>" + esc(msg) + "</span>" + (act ? "<button>" + esc(act) + "</button>" : "") + "</div>";
  if (act) host.querySelector("button").onclick = () => { host.innerHTML = ""; fn(); };
  toastTimer = setTimeout(() => { host.innerHTML = ""; }, act ? 6000 : 2600);
}

/* ---------- gebeurtenissen ---------- */
const packName = (kind, p) => kind === "templates" ? p.name : "Lijst van " + dateStr(p.at);
const tripIds = () => trip.length ? tripStores().map(s => s.id) : [];
const ACT = {
  nav:(k, t) => go(k, t.dataset.arg), back,
  toggle:k => { const it = S.items[k]; if (!it) return; if (!it.checked) tick = {k, t:Date.now()}; toggle(k); },
  rowtap:k => { const it = S.items[k]; if (!it) return; if (it.checked || document.body.classList.contains("shop")) ACT.toggle(k); else go("product", k); },
  plus:k => step(k, 1), minus:k => step(k, -1),
  del:k => { back(); removeItem(k); },
  forget:k => { back(); DB.del("items", k); DB.del("products", k); toast("Product vergeten"); },
  setcat:(k, c) => { const it = S.items[k]; DB.set("items", k, {cat:c}); DB.set("products", k, {name:it.name, cat:c}); },

  addq:(k, t) => DB.inc("items", k, "qty", +t.dataset.d),
  setunit:(k, t) => {
    const it = S.items[k], u = t.dataset.u, from = it.unit || ""; if (u === from) return;
    const c = convert(it.qty || 1, from, u), qty = c === null ? defQty(u) : c;
    DB.set("items", k, {unit:u, qty}); DB.set("products", k, {name:it.name, cat:it.cat, unit:u, dq:qty});
  },
  next:(k, t) => { const it = S.items[k], s = t.dataset.s; DB.set("items", k, {store:s}); toast(it.name + " verplaatst naar " + t.dataset.n, "Altijd daar kopen", () => DB.set("products", k, {name:it.name, cat:it.cat, store:s})); },
  stoggle:(k, t) => { const it = S.items[k], on = !t.classList.contains("on"); t.classList.toggle("on", on); setTimeout(() => DB.set("products", k, {name:it.name, cat:it.cat, staple:on}), 200); },
  clear:clearDone,
  pick:k => pick(+k),
  quick:k => { const p = product(k); if (p) addItem(p.name); $("q").focus(); },
  dueadd:k => { const p = product(k); if (p) addItem(p.name); },
  snooze:k => { const p = product(k); if (!p) return; const r = rhythm(p); DB.set("products", k, {name:p.name, cat:p.cat, snooze:Date.now() + (r ? r.days : 4) * DAY / 2}); },
  shop:() => { const on = !document.body.classList.contains("shop"); setShop(on); window.scrollTo(0, 0); if (on) toast("Tik een product aan om het af te vinken"); },
  share:() => {
    const lines = [], ts = tripStores(), ids = ts.map(s => s.id);

      const mine = Object.entries(S.items).filter(([k, v]) => !v.checked && storeOf(k, v, ids) === st.id).map(e => e[1]); if (!mine.length) continue;
      if (ts.length > 1) lines.push("== " + st.name + " ==");
      for (const c of order(st)) { const r = mine.filter(v => v.cat === c).sort(byName); if (r.length) lines.push(CAT[c].name + ":", ...r.map(v => "- " + (v.unit ? amount(v) + " " : (v.qty || 1) > 1 ? v.qty + "x " : "") + v.name + (v.note ? " (" + v.note + ")" : "")), ""); }
    }
    if (!lines.length) return toast("Er staat niets open op de lijst");
    const txt = lines.join("\n").trim();
    try { (navigator.share ? navigator.share({text:txt}) : navigator.clipboard.writeText(txt).then(() => toast("Lijst gekopieerd"))).catch(() => {}); } catch { toast("Delen lukt hier niet"); }
  },
  puse:(k, t) => { const p = S[t.dataset.kind][k]; if (p) applyPack(packName(t.dataset.kind, p), p.items, false); },
  pnew:(k, t) => { const p = S[t.dataset.kind][k]; if (p) applyPack(packName(t.dataset.kind, p), p.items, true); },
  pdel:(k, t) => { const c = t.dataset.kind, old = S[c][k]; back(); DB.del(c, k); toast("Verwijderd", "Ongedaan maken", () => DB.set(c, k, old)); },
  pitem:(k, t) => { const tp = S.templates[k]; if (!tp) return; DB.set("templates", k, {items:(tp.items || []).filter((x, i) => i !== +t.dataset.i)}); render(true); },
  pstep:(k, t) => {
    const tp = S.templates[k]; if (!tp) return;
    const items = (tp.items || []).map(x => ({...x})), i = +t.dataset.i, it = items[i]; if (!it) return;

  },
  padd:() => {
    const inp = $("tplAdd"), a = parse(inp.value), key = keyOf(a.name), k = args.template, tp = S.templates[k];
    if (!key || !tp) return inp.focus();

  stedit:() => { args.stEdit = !args.stEdit; render(true); },

  signout:() => { DB.signOut(); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]"); if (!t || t.disabled || !ACT[t.dataset.a]) return;
  const ae = document.activeElement;
  if (ae && ae !== t && /INPUT|SELECT/.test(ae.tagName) && (ae.id === "amtIn" || ae.id === "noteIn")) ae.blur();
  ACT[t.dataset.a](t.dataset.k, t, e);
});
document.addEventListener("change", e => {
  const t = e.target, k = t.dataset.k;
  if (t.id === "noteIn") DB.set("items", k, {note:t.value.trim()});
  else if (t.id === "tplName") { const n = t.value.trim(); if (n && S.templates[k]) DB.set("templates", k, {name:n}); else render(true); }
  else if (t.id === "amtIn") { const n = parseFloat(t.value.replace(",", ".")); t.blur(); if (n > 0) DB.set("items", k, {qty:Math.round(n * 100) / 100}); else render(true); }
  else if (t.id === "catSel") { t.blur(); ACT.setcat(k, t.value); }
  else if (t.id === "storeSel") { t.blur(); ACT.setstore(k, t.value); }
});
document.addEventListener("keydown", e => {
  const t = e.target; if (e.key !== "Enter" || !t.dataset) return;
  if (t.dataset.enter) { e.preventDefault(); ACT[t.dataset.enter](); }
  else if (t.id === "amtIn" || t.id === "noteIn" || t.id === "tplName") t.blur();
});
document.addEventListener("focusout", e => { if ($("page").contains(e.target)) setTimeout(() => { if (route !== "lijst") render(); }, 0); });
$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  if (!keyOf(parse($("q").value).name)) return $("q").focus();
  renderSug(); pick(enterIdx);
});
$("q").addEventListener("input", renderSug);
$("q").addEventListener("focus", renderSug);
$("q").addEventListener("blur", () => setTimeout(renderSug, 180));
$("sug").addEventListener("pointerdown", e => e.preventDefault());
addEventListener("hashchange", onRoute);

/* ---------- slepen in de looproute ---------- */
let drag = null, dragLock = false;
document.addEventListener("pointerdown", e => {
  const g = e.target.closest(".grip"); if (!g || drag || dragLock || e.button > 0) return;
  e.preventDefault();
  const el = g.closest(".cell"), box = el.parentElement, items = [...box.children], from = items.indexOf(el);
  // Posities ten opzichte van de lijst zelf, zodat de grenzen kloppen waar de lijst ook op de pagina staat.
  const tops = items.map(i => i.getBoundingClientRect().top), hs = items.map(i => i.offsetHeight), last = items.length - 1;
  drag = {el, box, items, from, to:from, id:e.pointerId, cy:e.clientY, y0:e.clientY + window.scrollY, h:hs[from], hs,
    mids:tops.map((t, i) => t - tops[0] + hs[i] / 2), min:tops[0] - tops[from], max:tops[last] + hs[last] - tops[from] - hs[from]};
  dragLock = true;
  try { g.setPointerCapture(e.pointerId); } catch {}
  box.classList.add("sorting"); el.classList.add("drag");
  try { navigator.vibrate && navigator.vibrate(6); } catch {}
  drag.raf = requestAnimationFrame(autoScroll);
});
function moveDrag(){
  const d = drag, dy = Math.max(d.min, Math.min(d.max, d.cy + window.scrollY - d.y0)), c = d.mids[d.from] + dy;
  d.dy = dy;
  let to = d.from;
  // Op of voorbij het midden van een ander schap telt als gepasseerd, zodat ook de eerste en laatste plek bereikbaar zijn.
  d.mids.forEach((m, i) => { if (i < d.from && c <= m && i < to) to = i; if (i > d.from && c >= m && i > to) to = i; });
  d.to = to;
  d.el.style.transform = "translateY(" + dy + "px)";
  d.items.forEach((it, i) => {
    if (it === d.el) return;
    const s = i > d.from && i <= to ? -d.h : i < d.from && i >= to ? d.h : 0;
    it.style.transform = s ? "translateY(" + s + "px)" : "";
  });
}
function autoScroll(){
  if (!drag) return;
  const y = drag.cy, edge = 80, top = $("top").getBoundingClientRect().bottom, bottom = window.innerHeight - document.querySelector(".tabs").offsetHeight;
  const v = y < top + edge ? -Math.ceil((top + edge - y) / 5) : y > bottom - edge ? Math.ceil((y - bottom + edge) / 5) : 0;
  if (v) { window.scrollBy(0, Math.max(-18, Math.min(18, v))); moveDrag(); }
  drag.raf = requestAnimationFrame(autoScroll);
}
function endDrag(e){
  const d = drag; if (!d || (e && e.pointerId !== d.id)) return;
  drag = null; cancelAnimationFrame(d.raf);
  let off = 0;
  if (d.to > d.from) for (let i = d.from + 1; i <= d.to; i++) off += d.hs[i];
  else for (let i = d.to; i < d.from; i++) off -= d.hs[i];
  d.el.classList.add("drop"); d.el.style.transform = "translateY(" + off + "px)";
  setTimeout(() => {
    dragLock = false;
    const st = storeList().find(s => s.id === args.looproute);
    if (st && d.to !== d.from) {
      const o = order(st), [c] = o.splice(d.from, 1); o.splice(d.to, 0, c);
      DB.set("stores", st.id, {name:st.name, order:o});
    }
    render(true);
  }, 190);
}
document.addEventListener("pointermove", e => { if (drag && e.pointerId === drag.id) { drag.cy = e.clientY; moveDrag(); } });
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
addEventListener("scroll", () => $("top").classList.toggle("scrolled", window.scrollY > 2), {passive:true});
const net = () => { $("off").hidden = navigator.onLine !== false; };
addEventListener("online", net); addEventListener("offline", net); net();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && document.body.classList.contains("shop") && navigator.wakeLock) navigator.wakeLock.request("screen").then(l => { wake = l; }).catch(() => {}); });

/* ---------- start ---------- */
applyTheme(); buildTabs();
$("addIco").outerHTML = ico("plus"); $("addBtn").innerHTML = ico("arrowUp"); $("gateLogo").innerHTML = ico("list");
const cfg = window.FIREBASE_CONFIG || {};
if (cfg.apiKey) { DB = Fire; Fire.init(cfg).catch(e => gate("Firebase laden mislukt: " + (e.message || e))); }
else { DB = Local; Local.init(); }
try { if ("serviceWorker" in navigator && location.protocol === "https:" && cfg.apiKey) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch {}
</script>
