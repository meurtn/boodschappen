<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lijstjes</title>
<meta name="theme-color" id="themeColor" content="#edf1f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lijstjes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script>
(function(){var t="auto";try{t=localStorage.getItem("lijstjes.theme")||"auto"}catch(e){}
var d=t==="dark"||(t==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.dataset.theme=d?"dark":"light";
var c="a";try{c=localStorage.getItem("lijstjes.dens")||"a"}catch(e){}document.documentElement.dataset.dens=c})();
</script>
<style>
:root{
  --bg:#edf1f6;--surface:#fff;--fill:#e2e8f0;--text:#18202b;--mute:#5f6b7c;--faint:#9aa5b4;--line:#d5dce6;
  --acc:#2b5fa8;--acc-ink:#fff;--soft:#dde8f7;--danger:#b4412f;
  --q1:#1f4f94;--q2:#3f77c4;--bar:rgba(237,241,246,.86);--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0d1116;--surface:#1c232d;--fill:#28313d;--text:#e6eaf0;--mute:#98a5b5;--faint:#657182;--line:#313b48;
  --acc:#7fb0ee;--acc-ink:#0b1420;--soft:#223450;--danger:#e8836f;
  --q1:#6ea4ea;--q2:#a9cbf5;--bar:rgba(13,17,22,.86);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));transition:background-color .25s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{opacity:.3;cursor:default}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.grow{flex:1;min-width:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

/* bovenbalk */
.top{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);padding-top:env(safe-area-inset-top);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.barin{display:flex;align-items:center;gap:6px;min-height:56px;padding:6px 0}
.barin h1{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barin h1.sm{font-size:17px;letter-spacing:-.005em}
.sub{font-size:13.5px;color:var(--mute);margin-top:1px}
.sub button{color:var(--acc)}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none;transition:background-color .15s,transform .15s}
.ib:active{background:var(--fill);transform:scale(.94)}
.ib.back{margin-left:-10px}
.ib.sm{width:34px;height:34px;color:var(--mute)}
.ib.sm .i{width:18px;height:18px}
.tb{display:inline-flex;align-items:center;gap:2px;color:var(--acc);font-size:15px;font-weight:500;padding:8px 0 8px 8px;flex:none}
.tb .i{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 11px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:500;flex:none;transition:transform .15s,background-color .15s}
.pill:active{transform:scale(.96);background:var(--fill)}
.pill .i{width:18px;height:18px;color:var(--acc)}

/* toevoegen */
.add{display:flex;align-items:center;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:0 6px 0 12px;margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
.add:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.add>.i{color:var(--faint);width:20px;height:20px}
.add input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;padding:0 10px}
.add input::placeholder,.field::placeholder,.inl::placeholder{color:var(--faint)}
.addb{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .18s,transform .18s var(--ease)}
.addb .i{width:18px;height:18px;stroke-width:2}
.add.has .addb{opacity:1;transform:none;pointer-events:auto}
.sug{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:-2px 0 10px;max-height:46vh;overflow:auto;animation:drop .18s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}}
.s{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:8px 14px;border-bottom:1px solid var(--line)}
.s:last-child{border-bottom:0}
.s small{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58%}
.s small.inc{color:var(--acc);font-weight:500}
.sug .ch{margin:12px 14px 8px}
.sug .chips{padding:0 14px 14px}
.prog{height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;width:0;background:var(--acc);border-radius:3px;transition:width .4s var(--ease)}

.ibb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--q1);flex:none;position:relative;transition:transform .15s,background-color .15s,border-color .15s}
.ibb .i{width:20px;height:20px}
.ibb:active{transform:scale(.93)}
.ibb.on{background:var(--soft);border-color:transparent}
.ibb.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ibb.pri .i{stroke-width:2}
.ibb.dot::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--q2);box-shadow:0 0 0 2px var(--surface)}
.barin .ibb+.ibb{margin-left:2px}
.pop{position:fixed;z-index:25;min-width:220px;max-width:calc(100vw - 24px);max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 36px rgba(0,0,0,.18);transform-origin:top right;animation:popin .16s var(--ease)}
.pop.out{animation:popout .14s ease-in forwards}
@keyframes popin{from{opacity:0;transform:scale(.94) translateY(-4px)}}
@keyframes popout{to{opacity:0;transform:scale(.96) translateY(-3px)}}
.popi{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 10px;border-radius:9px;font-size:15px;transition:background-color .12s}
.popi:active{background:var(--fill)}
.popi.on{color:var(--acc);font-weight:500}
.popi .pc{width:18px;display:grid;place-items:center;flex:none}
.popi .pc .i{width:17px;height:17px}
.popi .pn{font-size:13px;color:var(--q2);font-variant-numeric:tabular-nums;font-weight:500}
.poph{font-size:12.5px;color:var(--mute);font-weight:500;padding:6px 10px 4px}
.stb{width:36px;height:36px;display:grid;place-items:center;flex:none;border-radius:50%;margin-right:6px;transition:transform .12s}
.stb:active{transform:scale(.9)}
.stb.on .lg{box-shadow:0 0 0 2px var(--acc)}
.lgnone{display:grid;place-items:center;background:var(--fill);color:var(--mute);box-shadow:none}
.lgnone .i{width:13px;height:13px}
.ch.sub .lg{margin-right:2px}
.btn.fixw{min-width:112px}
.pagecol{display:flex;flex-direction:column;min-height:calc(100vh - 170px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.pbottom{margin-top:auto;padding-bottom:8px}
.popsep{height:1px;background:var(--line);margin:6px 4px}
.inl.left{text-align:left}

/* pagina-overgangen */
#main.fwd{animation:fwd .26s var(--ease)}
#main.back{animation:bck .26s var(--ease)}
html,body{overscroll-behavior-x:none}
#main.tab,#pgList.swap{animation:tab .2s ease-out}
html,body{overflow-x:clip}
#pgList{position:relative}
.ghost{position:absolute;pointer-events:none}
#barIn .grow{position:relative}
.tghost{position:absolute;left:0;top:0;margin:0;pointer-events:none;white-space:nowrap}
.pop.mid{min-width:min(300px,calc(100vw - 48px));max-height:70vh;padding:8px;border-radius:18px;animation:popmid .18s var(--ease)}
.pop.mid.out{animation:popout .14s ease-in forwards}
@keyframes popmid{from{opacity:0;transform:scale(.94)}}
@keyframes fwd{from{opacity:0;transform:translateX(20px)}}
@keyframes bck{from{opacity:0;transform:translateX(-20px)}}
@keyframes tab{from{opacity:0;transform:translateY(5px)}}

/* koppen en tekst */
.ch{display:flex;align-items:center;gap:7px;margin:22px 2px 8px;font-size:13px;font-weight:500;color:var(--mute);letter-spacing:.01em}
.ch .em{font-size:15px;line-height:1}
.ch .n{margin-left:auto;font-weight:400;color:var(--faint)}
.ch .n button{color:var(--acc);font-weight:500}
.lead{color:var(--mute);font-size:14.5px;margin:4px 2px 16px}
.hint{color:var(--mute);font-size:13px;margin:10px 2px 0}
.note{color:var(--mute);font-size:13px;margin:0 2px 4px}
.offline{font-size:13px;color:var(--mute);text-align:center;padding:6px 0 0}
.shead{display:flex;align-items:center;gap:10px;margin:30px 2px -8px;padding-top:22px;border-top:1px solid var(--line);font-size:17px;font-weight:600;letter-spacing:-.005em}
.shead.first{border-top:0;padding-top:0;margin-top:22px}
.lg{border-radius:50%;flex:none;object-fit:cover;background:#fff;box-shadow:0 0 0 1px var(--line)}
.lgf{display:grid;place-items:center;color:#fff;font-weight:600;box-shadow:none;line-height:1}
.lgbtn{flex:none;display:grid;place-items:center;margin-right:2px}
.cell .lg+.tb{margin-left:4px}
.navrow .lg{margin-right:4px}
.popi .lg{margin-right:-2px}
.shead small{margin-left:auto;font-size:13px;font-weight:400;color:var(--mute)}

/* lijsten */
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.cell{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:9px 14px;border-bottom:1px solid var(--line);transition:background-color .15s}
.cell:last-child{border-bottom:0}
button.cell:active{background:var(--fill)}
.cell>.i{color:var(--mute)}
.cell>.i:last-child{width:18px;height:18px;color:var(--faint)}
.cell .em{font-size:17px;width:22px;text-align:center}
.ct{display:block}
.cs{display:block;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.danger{color:var(--danger);justify-content:center}
.cell select{appearance:none;-webkit-appearance:none;border:0;background:none;outline:0;color:var(--mute);text-align:right;text-align-last:right;max-width:62%;padding:6px 0;cursor:pointer}
.cell select+.i{width:16px;height:16px;margin-left:-6px}
.inl{border:0;background:none;outline:0;text-align:right;width:110px;padding:6px 0}
.inl.grow{width:auto}
.lbl{flex:none}
.qty{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}

/* productregels */
.row{display:flex;align-items:stretch;min-height:52px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.rin{flex:1;display:flex;align-items:center;padding-right:8px;background:var(--surface);position:relative;z-index:1;min-width:0}
body.shop .row{touch-action:pan-y}
.acts{position:absolute;inset:0;display:none;justify-content:space-between}
.row.swiping .acts{display:flex}
.acts .side{display:flex;visibility:hidden}
.row.sl .side.l,.row.sr .side.r{visibility:visible}
.sa{width:66px;display:grid;place-items:center}
.sa .i{width:25px;height:25px;stroke-width:2.4}
.sa.miss{background:var(--q1);color:var(--acc-ink)}
.sa.next{background:var(--soft);color:var(--acc)}
.sa:active{filter:brightness(.92)}
.row.miss .nm{color:var(--mute)}
.row.miss .nm .qty{padding:0 0 0 4px;font-size:13px}
/* lijstmodus is plannen: geen afvinkrondjes */
body:not(.shop) .row .tick{display:none}
body:not(.shop) .row .rin .rmain{padding-left:14px}
.cartnote{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:12px;padding:6px 6px 6px 14px;margin:6px 0 4px;font-size:14px;color:var(--acc)}
.cartnote .tb{padding:8px}
.modal{position:fixed;inset:0;z-index:35;background:rgba(10,15,22,.38);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom));animation:fade .18s}
.modal{-webkit-backdrop-filter:blur(8px) saturate(.9);backdrop-filter:blur(8px) saturate(.9);background:rgba(10,15,22,.28)}
.modal.center{align-items:center;padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom))}
.mcard.sheet{max-height:100%;display:flex;flex-direction:column;padding:0;overflow:hidden}
.shh{display:flex;align-items:center;gap:10px;padding:16px 14px 10px 20px;border-bottom:1px solid var(--line)}
.shh h2{flex:1;margin:0;font-size:20px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shb{overflow:auto;padding:16px 16px 6px;-webkit-overflow-scrolling:touch}
.shb .hero{margin-top:0}
/* Lijstmenu: achtergrond vervaagt */
#popHost:not(:empty)::before{content:"";position:fixed;inset:0;z-index:24;background:rgba(10,15,22,.14);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .18s}
#popHost:has(.pop.out)::before{animation:fadeout .14s forwards}
.modal.out{animation:fadeout .16s forwards}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
.mcard{width:100%;max-width:528px;background:var(--surface);border-radius:20px;padding:22px 18px 16px;box-shadow:0 18px 50px rgba(0,0,0,.22);animation:rise .24s var(--ease)}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
.mcard h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0 2px 12px}
.stat{display:flex;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.stat:last-of-type{border-bottom:0}
.stat b{font-size:22px;font-weight:600;color:var(--q1);min-width:30px;font-variant-numeric:tabular-nums}
.stat small{color:var(--mute);font-size:13px}
.row:last-child{border-bottom:0}
.tick{width:48px;align-self:stretch;display:grid;place-items:center;flex:none}
.tick .c{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;transition:background-color .18s,border-color .18s}
.tick .i{width:13px;height:13px;stroke:var(--acc-ink);stroke-width:2.6;stroke-dasharray:24;stroke-dashoffset:24}
.tick:active .c{transform:scale(.88)}
.row.done .tick .c{background:var(--acc);border-color:var(--acc)}
.row.done .tick .i{stroke-dashoffset:0}
.row.just .tick .c{animation:pop .32s var(--ease)}
.row.just .tick .i{animation:draw .26s .06s ease-out both}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}}
@keyframes draw{from{stroke-dashoffset:24}}
.rmain{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:8px 8px 8px 0}
.nm{overflow-wrap:anywhere}
.nt{font-size:13px;color:var(--mute)}
.row.done .nm{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--faint)}
.row .qty{padding:0 8px;color:var(--q2);font-weight:500}
.step{display:flex;align-items:center;height:34px;border:1px solid var(--line);border-radius:10px;flex:none}
.step button{width:32px;height:32px;display:grid;place-items:center;color:var(--q1);border-radius:9px;transition:background-color .12s}
.step button:active{background:var(--fill)}
.step .i{width:15px;height:15px;stroke-width:2}
.step b{color:var(--q2);min-width:18px;padding:0 2px;text-align:center;font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.nx{flex:none;display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;margin-right:4px;border-radius:9px;border:1px solid var(--line);color:var(--mute);font-size:13px}
.nx .i{width:13px;height:13px}
.row.flash .rin,.cell.flash{animation:fl 1s ease-out}
.leave{transition:height .28s var(--ease),min-height .28s var(--ease),margin .28s var(--ease),opacity .2s ease-out,border-color .2s;height:0!important;min-height:0!important;margin-top:0!important;margin-bottom:0!important;opacity:0;border-color:transparent!important}
@keyframes fl{from{background:var(--soft)}}

/* knoppen, velden, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-size:15px;font-weight:600;white-space:nowrap;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.975);opacity:.9}
.btn.sec{background:var(--fill);color:var(--text)}
.btn.text{background:none;color:var(--acc)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.field{flex:1;min-width:0;width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;outline:0;transition:border-color .15s,box-shadow .15s}
.field:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.line{display:flex;gap:8px;align-items:center}
.line.center{justify-content:center;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px;margin:12px 2px 0}
.check input{width:18px;height:18px;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.center{justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;transition:background-color .15s,border-color .15s,color .15s,transform .12s}
button.chip:active{transform:scale(.96)}
.chip.on{background:var(--soft);border-color:transparent;color:var(--acc);font-weight:500}
.chip .i{width:14px;height:14px;color:var(--faint)}
.chip.duo{padding:0}
.chip.duo button:first-child{padding:0 4px 0 14px;min-height:34px}
.chip.duo button:last-child{padding:0 10px 0 6px;min-height:34px;display:grid;place-items:center}
.chip small{color:var(--mute);font-size:13px;margin-left:6px}
.seg{display:flex;background:var(--fill);border-radius:11px;padding:3px;gap:2px;margin-bottom:14px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;color:var(--mute);text-align:center;transition:background-color .18s,color .18s,box-shadow .18s}
.seg button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--faint);flex:none;position:relative;transition:background-color .2s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.sw.on{background:var(--acc)}
.sw.on i{transform:translateX(18px)}
.numhit{width:44px;height:44px;display:grid;place-items:center;flex:none;margin:-6px 0}
.numhit:active .num{transform:scale(.88)}
.navrow{display:flex;align-items:center;gap:8px;align-self:stretch;min-height:34px}
.navrow .i{width:18px;height:18px;color:var(--faint)}
.num{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;transition:background-color .18s,border-color .18s}
.num.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.hero{padding:10px 0 20px}
.bigstep{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:16px}
.bigstep button{color:var(--q1);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:transform .12s,background-color .12s}
.bigstep button:active{transform:scale(.92);background:var(--fill)}
.bigstep b{font-size:34px;font-weight:300;letter-spacing:-.02em;min-width:90px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;padding:48px 20px 18px;color:var(--mute);font-size:14.5px}
.empty .eb{width:52px;height:52px;border-radius:50%;background:var(--fill);display:grid;place-items:center;margin:0 auto 14px;color:var(--mute)}
.empty h2{font-size:17px;font-weight:600;color:var(--text);margin-bottom:4px}

/* slepen */
.grip{width:44px;height:44px;margin:-8px -10px -8px 0;display:grid;place-items:center;color:var(--faint);touch-action:none;cursor:grab;flex:none}
.grip .i{width:20px;height:20px}
.group.sorting{overflow:visible}
.group.sorting .cell{transition:transform .2s var(--ease)}
.group.sorting .cell.drag{position:relative;z-index:3;transition:box-shadow .2s;background:var(--surface);border-radius:12px;border-bottom-color:transparent;box-shadow:0 10px 28px rgba(0,0,0,.16),0 0 0 1px var(--line);cursor:grabbing}
.group.sorting .cell.drag .grip{color:var(--acc);cursor:grabbing}
.group.sorting .cell.drag.drop{transition:transform .19s var(--ease),box-shadow .19s;box-shadow:none}
body:has(.sorting){user-select:none;-webkit-user-select:none}

:root[data-dens=b] body .row{min-height:44px}
:root[data-dens=b] body .rmain{padding:5px 8px 5px 0}
:root[data-dens=b] body .step{height:30px}:root[data-dens=b] body .step button{width:30px;height:28px}
:root[data-dens=b] body .ch{margin:16px 2px 6px}
:root[data-dens=c] body .row{min-height:40px}
:root[data-dens=c] body .rmain{padding:3px 8px 3px 0}
:root[data-dens=c] body .tick{width:42px}:root[data-dens=c] body .tick .c{width:20px;height:20px}
:root[data-dens=c] body .step{height:28px;border-radius:8px}:root[data-dens=c] body .step button{width:28px;height:26px}:root[data-dens=c] body .step b{font-size:14px}
:root[data-dens=c] body .ch{margin:14px 2px 5px}:root[data-dens=c] body .group{margin-bottom:10px;border-radius:12px}
:root[data-dens=d] body .row{min-height:36px}
:root[data-dens=d] body .rmain{padding:2px 8px 2px 0}:root[data-dens=d] body .nm{font-size:15px}
:root[data-dens=d] body .tick{width:40px}:root[data-dens=d] body .tick .c{width:18px;height:18px}
:root[data-dens=d] body .step{height:26px;border:0;background:var(--fill);border-radius:7px}:root[data-dens=d] body .step button{width:26px;height:26px}:root[data-dens=d] body .step .i{width:13px;height:13px}:root[data-dens=d] body .step b{font-size:13.5px}
:root[data-dens=d] body .ch{margin:12px 2px 4px;font-size:12.5px}:root[data-dens=d] body .group{margin-bottom:8px;border-radius:11px}
:root[data-dens=b] body.shop .row{min-height:52px}:root[data-dens=b] body.shop .nm{font-size:16.5px}
:root[data-dens=c] body.shop .row{min-height:46px}:root[data-dens=c] body.shop .nm{font-size:16px}:root[data-dens=c] body.shop .tick .c{width:23px;height:23px}
:root[data-dens=d] body.shop .row{min-height:42px}:root[data-dens=d] body.shop .nm{font-size:15.5px}:root[data-dens=d] body.shop .tick .c{width:21px;height:21px}
.sep{height:1px;background:var(--line);border:0;margin:28px 2px 6px}
.range{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 30px 12px;margin-bottom:10px}
.range input{width:100%;margin:0;accent-color:var(--acc);height:28px}
.range .ticks{position:relative;height:18px;margin:4px 8px 0;font-size:12.5px;color:var(--mute)}
.range .ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.range .ticks span.on{color:var(--acc);font-weight:500}
.preview{pointer-events:none}
.shead.tour{position:sticky;top:var(--toph,64px);z-index:3;background:var(--bg);margin:18px -16px -6px;padding:12px 18px 10px;border-top:1px solid var(--line)}
.shead.tour.first{border-top:0;margin-top:4px}
.shead.tour.now small{color:var(--acc);font-weight:500}
.stopdone{margin:12px 2px 4px}
/* Elke winkel in de ronde als eigen kaart */
:root{--card:#f7f9fc}:root[data-theme=dark]{--card:#151b23}
.stopcard{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:14px -6px 0;padding:0 12px 14px;box-shadow:0 1px 2px rgba(20,35,60,.04)}
.stopcard:first-of-type{margin-top:6px}
.stopcard.now{border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.stopcard .shead.tour,.stopcard .shead.tour.first{margin:0 -12px 2px;padding:14px 12px 10px;border-top:0;background:var(--card);border-radius:22px 22px 0 0}
.stopcard .ch:first-of-type{margin-top:8px}
.stopcard .stopdone{margin:4px 2px 0}
.stopcard>.group:last-child{margin-bottom:0}
.stopcard{padding-bottom:12px}
.stopcard .shead+.group{margin-top:4px!important}
.ttl{display:inline-flex;align-items:center;gap:9px}
.mnote{background:var(--soft);color:var(--acc);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.onlyone{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;margin:2px 0 4px;padding:12px 14px}
.onlyone small{font-size:13px;opacity:.85;font-weight:400}
.orline{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:12px 2px 10px}.orline:before,.orline:after{content:"";flex:1;height:1px;background:var(--line)}
.mlead{color:var(--mute);font-size:14px;margin:-6px 2px 12px}
.mcard.start{height:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column}
.mcard.start .slist{flex:0 0 auto}
.mcard.start>.line:last-child{margin-top:auto!important;padding-top:16px}
.slist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scand{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;border-bottom:1px solid var(--line);text-align:left;transition:background-color .15s}
.scand:last-child{border-bottom:0}
.scand.on{background:var(--soft)}
.scand.empty:not(.on){opacity:.55}
.btn:disabled{opacity:.4}

/* meekijken */
body.watch .add,body.watch .sug,body.watch .note{display:none}
.route{display:flex;align-items:flex-start;margin:14px 0 4px;padding:14px 10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.rstop{flex:0 0 auto;width:84px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;position:relative}
.rstop b{font-size:14px;font-weight:600;margin-top:3px}
.rstop small{font-size:12px;color:var(--mute)}
.rstop.nu small{color:var(--acc);font-weight:500}
.rstop.nu .lg{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--acc);animation:pulse 2.4s ease-in-out infinite}
.rstop.straks .lg{opacity:.5}
.rstop.klaar .lg{opacity:.85}
.rok{position:absolute;top:22px;left:50%;margin-left:8px;width:18px;height:18px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.rok .i{width:11px;height:11px;stroke-width:3}
.rline{flex:1;height:2px;background:var(--line);margin-top:17px;border-radius:2px;min-width:12px}
.rline.on{background:var(--acc)}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--surface),0 0 0 7px var(--soft)}}
.wrow{display:flex;align-items:center;gap:10px;min-height:46px;padding:7px 14px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .nm{display:block}
.wrow .nt{display:block;font-size:13px;color:var(--mute)}
.wrow .qty{color:var(--q2);font-weight:500}
.wrow.in .nm{color:var(--mute)}
.wrow.miss .nm{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--faint)}
.wc{width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}
.wc .i{width:12px;height:12px;stroke-width:2.8}
.wt{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.flash{position:fixed;inset:0;z-index:28;display:grid;place-items:center;pointer-events:none;padding:24px}
.fcard{background:var(--surface);border-radius:24px;padding:26px 30px 24px;min-width:240px;max-width:100%;text-align:center;box-shadow:0 24px 60px rgba(10,20,35,.28),0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;animation:fin .38s cubic-bezier(.2,1.3,.4,1)}
.flash.out .fcard{animation:fout .3s ease-in forwards}
@keyframes fin{from{opacity:0;transform:scale(.82) translateY(14px)}}
@keyframes fout{to{opacity:0;transform:scale(.94) translateY(-10px)}}
.fc{width:54px;height:54px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin-bottom:6px}
.fc .i{width:28px;height:28px;stroke-width:2.6;stroke-dasharray:24;animation:draw .35s .18s ease-out both}
.fcard small{font-size:13px;color:var(--mute)}
.fcard b{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.fq{font-size:17px;color:var(--q2);font-weight:500}
.fs{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--mute);margin-top:4px}

/* tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs>div{max-width:560px;margin:0 auto;display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;color:var(--mute);transition:color .2s}
.tabs .tp{width:52px;height:28px;border-radius:14px;display:grid;place-items:center;transition:background-color .25s,transform .15s}
.tabs button:active .tp{transform:scale(.92)}
.tabs button.on{color:var(--acc);font-weight:500}
.tabs button.on .tp{background:var(--soft)}

/* winkelmodus */
body.shop .add,body.shop .sug,body.shop .step,body.shop .tabs,body.shop .note{display:none}
body.shop{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
body.shop .toast{bottom:calc(20px + env(safe-area-inset-bottom))}
body.shop .row{min-height:60px}
body.shop .nm{font-size:17px}
body.shop .tick .c{width:26px;height:26px}
body:not(.shop) .shoponly,body:not(.shop) .nx,body:not(.shop) .shopbar{display:none}
.shopbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.shopbar .btn{max-width:528px;margin:0 auto;display:flex}

/* melding en poort */
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;display:flex;gap:16px;align-items:center;z-index:30;width:max-content;max-width:calc(100vw - 32px);font-size:14.5px;box-shadow:0 6px 24px rgba(0,0,0,.18);animation:tin .24s var(--ease)}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.toast.out{animation:tout .16s ease-in forwards}
@keyframes tout{to{opacity:0;transform:translate(-50%,8px)}}
body.toasting{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
body.shop.toasting{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.toast button{pointer-events:auto;font-weight:600;white-space:nowrap;color:inherit;text-decoration:underline;text-underline-offset:3px}
.gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:24px;text-align:center}

// Tijdens het wegschuiven van een afgevinkt product wordt niet opnieuw getekend; daarna in een keer.
let hold = 0, pending = false;
const leaving = new Set();
function release(){ if (--hold <= 0) { hold = 0; if (pending) { pending = false; render(); } } }
function leaveRow(row, k, checking, fn){
  hold++; leaving.add(k);
  if (checking) row.classList.add("done", "just");
  try { navigator.vibrate && navigator.vibrate(8); } catch {}
  setTimeout(() => {
    const group = row.parentElement, rest = [...group.children].filter(r => !r.classList.contains("leave") && r !== row);
    const els = [row];
    if (!rest.length) { const head = group.previousElementSibling; els.push(group); if (head && head.classList.contains("ch")) els.push(head); }
    els.forEach(el => { el.style.height = el.offsetHeight + "px"; el.style.overflow = "hidden"; });
    void row.offsetHeight;
    els.forEach(el => el.classList.add("leave"));
    setTimeout(() => { leaving.delete(k); (fn || toggle)(k, true); release(); }, 300);
  }, checking ? 200 : 60);
}
function render(force){
  if (!ready || !route || dragLock) return;
  rebuildCats();
  if (hold > 0) { pending = true; return; }
  const isList = route === "lijst";
  $("pgList").hidden = !isList; $("listHead").hidden = !isList; $("page").hidden = isList;
  let P;
  if (isList) P = renderList();
  else {
    P = PAGES[route]();
    const ae = document.activeElement;
    const typing = ae && /INPUT|SELECT/.test(ae.tagName) && $("page").contains(ae);
    if (force || !typing) {
      // Half getypte tekst in toevoegvelden blijft staan als de pagina opnieuw getekend wordt.
      const keep = [...$("page").querySelectorAll("input.field")].filter(i => i.id && i.value).map(i => [i.id, i.value]), foc = typing && ae.id;
      $("page").innerHTML = P.html;
      keep.forEach(([id, v]) => { if ($(id)) $(id).value = v; });
      if (foc && $(foc) && $(foc).classList.contains("field")) $(foc).focus();
    }
  }
  const sub = !!PARENT[route];
  $("barIn").innerHTML = (sub ? "<button class='ib back' data-a='back' aria-label='Terug'>" + ico("chevL") + "</button>" : "") + "<div class='grow'><h1" + (sub ? " class='sm'" : "") + ">" + (P.titleHtml || esc(P.title)) + "</h1>" + (P.sub ? "<div class='sub'>" + P.sub + "</div>" : "") + "</div>" + (P.act || "");
  document.documentElement.style.setProperty("--toph", $("top").offsetHeight + "px");
  const root = rootOf(route); [...$("tabs").children].forEach((b, i) => b.classList.toggle("on", TABS[i][0] === root));
  renderSug();
  if (psheet) drawCard();
}
function setShop(on, quiet){
  if (on) setWatch(false, true);
  if (document.body.classList.contains("shop") === on) return;
  document.body.classList.toggle("shop", on);
  try { if (on && navigator.wakeLock) navigator.wakeLock.request("screen").then(l => { wake = l; }).catch(() => {}); else if (wake) { wake.release(); wake = null; } } catch {}
  if (!quiet) render();
}

/* ---------- melding ---------- */
let toastTimer;
// Melding onderin: blokkeert niets. Alleen de knop is aantikbaar, de lijst krijgt tijdelijk extra ruimte
// zodat je er onderuit kunt scrollen, en elke andere tik laat de melding meteen verdwijnen.
function toastHide(){
  const t = $("toastHost").firstChild; clearTimeout(toastTimer); document.body.classList.remove("toasting"); if (!t) return;
  t.classList.add("out"); setTimeout(() => { if ($("toastHost").firstChild === t) $("toastHost").innerHTML = ""; }, 160);
}
function toast(msg, act, fn){
  clearTimeout(toastTimer);
  const host = $("toastHost");
  host.innerHTML = "<div class='toast' role='status'><span>" + esc(msg) + "</span>" + (act ? "<button>" + esc(act) + "</button>" : "") + "</div>";
  if (act) host.querySelector("button").onclick = e => { e.stopPropagation(); toastHide(); fn(); };
  document.body.classList.add("toasting");
  toastTimer = setTimeout(toastHide, act ? 5000 : 2400);
}
document.addEventListener("pointerdown", e => { if ($("toastHost").firstChild && !e.target.closest(".toast button")) setTimeout(toastHide, 0); }, true);

document.addEventListener("click", e => {

  const v = y < top + edge ? -Math.ceil((top + edge - y) / 5) : y > bottom - edge ? Math.ceil((y - bottom + edge) / 5) : 0;
  if (v) { window.scrollBy(0, Math.max(-18, Math.min(18, v))); moveDrag(); }
  drag.raf = requestAnimationFrame(autoScroll);
}
function endDrag(e){
  const d = drag; if (!d || (e && e.pointerId !== d.id)) return;
  drag = null; cancelAnimationFrame(d.raf);
  let off = 0;
  if (d.to > d.from) for (let i = d.from + 1; i <= d.to; i++) off += d.hs[i];
  else for (let i = d.to; i < d.from; i++) off -= d.hs[i];
  d.el.classList.add("drop"); d.el.style.transform = "translateY(" + off + "px)";
  setTimeout(() => {
    dragLock = false;
    const st = storeList().find(s => s.id === args.looproute);
    if (st && d.to !== d.from) {
      const o = order(st), [c] = o.splice(d.from, 1); o.splice(d.to, 0, c);
      DB.set("stores", st.id, {name:st.name, order:o});
    }
    render(true);
  }, 190);
}
document.addEventListener("pointermove", e => { if (drag && e.pointerId === drag.id) { drag.cy = e.clientY; moveDrag(); } });
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
addEventListener("scroll", () => $("top").classList.toggle("scrolled", window.scrollY > 2), {passive:true});
const net = () => { $("off").hidden = navigator.onLine !== false; };
addEventListener("online", net); addEventListener("offline", net); net();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && document.body.classList.contains("shop") && navigator.wakeLock) navigator.wakeLock.request("screen").then(l => { wake = l; }).catch(() => {}); });
